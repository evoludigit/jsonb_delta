name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release for PostgreSQL ${{ matrix.pg-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # PG13 is EOL and lacks pg_sys::JsonbToJsonbValue (added in PG14), which
        # the 0.3.x binary rewrite depends on — see docs/COMPATIBILITY.md.
        pg-version: [14, 15, 16, 17]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install PostgreSQL ${{ matrix.pg-version }}
        run: |
          # Add PostgreSQL official repository for versions not in Ubuntu default repos
          if [[ "${{ matrix.pg-version }}" != "16" ]]; then
            sudo apt-get install -y wget ca-certificates
            wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
            echo "deb http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
            sudo apt-get update
          fi
          sudo apt-get install -y \
            postgresql-${{ matrix.pg-version }} \
            postgresql-server-dev-${{ matrix.pg-version }}

      - name: Install cargo-pgrx
        run: |
          cargo install --locked cargo-pgrx --version 0.17.0

      - name: Initialize pgrx
        run: |
          cargo pgrx init --pg${{ matrix.pg-version }}=/usr/lib/postgresql/${{ matrix.pg-version }}/bin/pg_config
          # Verify pgrx is properly initialized
          cargo pgrx status

      - name: Build release package
        run: |
          cargo pgrx package --pg-config=/usr/lib/postgresql/${{ matrix.pg-version }}/bin/pg_config

      - name: Create tarball
        run: |
          cd target/release/jsonb_delta-pg${{ matrix.pg-version }}
          tar czf ../jsonb_delta-${{ github.ref_name }}-pg${{ matrix.pg-version }}.tar.gz .

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsonb_delta-pg${{ matrix.pg-version }}
          path: target/release/jsonb_delta-${{ github.ref_name }}-pg${{ matrix.pg-version }}.tar.gz

  create-release:
    name: Create GitHub Release
    needs: [build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ ("^## \\[" ver "\\]") { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section for $version; using a generic body." >&2
            printf 'Release %s.\n\nSee CHANGELOG.md for details.\n' "$GITHUB_REF_NAME" > release-notes.md
          fi
          echo '----- release notes -----'
          cat release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/*/*.tar.gz
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
